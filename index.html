<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173b34">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>HAFS ENGLISH CLASS · 시작하기</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;color:#173b34;background:#f5f6f1}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:40px 20px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
main{width:100%;max-width:760px}
header{margin-bottom:32px}
.brand{margin:0 0 12px;font-size:13px;font-weight:750;letter-spacing:.12em}
h1{margin:0 0 12px;font-size:clamp(28px,5vw,38px);line-height:1.3;letter-spacing:-.04em}
.intro{margin:0;color:#51665c;font-size:17px}
nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.entry{display:flex;flex-direction:column;align-items:flex-start;min-height:170px;padding:26px;border:1px solid #b9c9bf;border-radius:18px;background:#fff;color:inherit;text-decoration:none;touch-action:manipulation}
.entry strong{font-size:25px;line-height:1.4}
.entry span{margin-top:10px;font-size:17px;color:#51665c}
.entry:hover{background:#edf3ed;border-color:#276b55}
.entry:focus-visible{outline:3px solid #2164b0;outline-offset:5px}
.entry:active{background:#e3ece3}
.note{margin:26px 0 0;color:#51665c;font-size:15px}
@media(max-width:540px){body{padding:32px 20px}header{margin-bottom:24px}nav{grid-template-columns:1fr}.entry{min-height:132px;padding:22px}.note{margin-top:22px}}
</style>
</head>
<body>
<main>
<header>
<p class="brand">HAFS ENGLISH CLASS</p>
<h1>사용할 화면을 선택하세요</h1>
<p class="intro">학생과 교사에게 필요한 화면으로 바로 이동합니다.</p>
</header>
<nav aria-label="학생·교사 화면 선택">
<a class="entry" href="./student/"><strong>학생용</strong><span>자리표 PDF 제출</span></a>
<a class="entry" href="./admin/"><strong>교사용</strong><span>자리표 확인 · 발표 기록</span></a>
</nav>
<p class="note">관리자는 교사용 화면에서 로그인한 뒤 기존 관리 메뉴를 이용하세요.</p>
</main>
</body>
</html>
